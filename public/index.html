<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Skyllabus learning platform.">
  <meta name="theme-color" content="#003A6B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="skyllabus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2">


  <title>skyllabus</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="skyllabus-loading" role="status" aria-live="polite" aria-label="Loading Skyllabus">
    <div class="skyllabus-loader-mark">
  <img
    src="icons/Icon-512.png"
    alt="Skyllabus logo"
    width="64"
    height="64"
  />
</div>
    <div class="skyllabus-loader-ring" aria-hidden="true"></div>
    <div class="skyllabus-loader-text">Loading Skyllabus…</div>
  </div>
  <style>
    html,body { margin:0; width:100%; height:100%; background:#f7fafc; }
    #skyllabus-loading { position:fixed; inset:0; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#f7fafc; color:#003a6b; font-family:Arial,Helvetica,sans-serif; transition:opacity .22s ease; }
    #skyllabus-loading.finished { opacity:0; pointer-events:none; }
    .skyllabus-loader-mark { display:grid; place-items:center; width:64px; height:64px; border-radius:18px; background:#003a6b; color:white; font-weight:800; font-size:38px; }
    .skyllabus-loader-ring { width:30px; height:30px; border:3px solid #d7e7f2; border-top-color:#1b5886; border-radius:50%; animation:skyllabus-spin .75s linear infinite; }
    .skyllabus-loader-text { font-size:14px; font-weight:600; letter-spacing:.2px; }
    @keyframes skyllabus-spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .skyllabus-loader-ring { animation-duration:2s; } }
  </style>
  <script>
    // Flutter fires this event when its first frame has actually rendered.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('skyllabus-loading');
      if (!loader) return;
      loader.classList.add('finished');
      window.setTimeout(function () { loader.remove(); }, 250);
    }, { once:true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
